<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>바리스타 주문판</title>
<style>

    --paper:#F2F1EC; --card:#FFFFFF; --line:#DAD8D0; --muted:#6B7570;

  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:18px;line-height:1.5;-webkit-user-select:none;user-select:none}
  button{font-family:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:0 16px 120px}

  header{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff}
  .bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
  .sta{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .sta small{display:block;font-size:13px;font-weight:500;opacity:.75;letter-spacing:0}
  .count{margin-left:auto;font-size:15px;opacity:.9}
  .count b{font-size:26px;font-weight:800}
  .iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;
    min-width:52px;height:52px;font-size:15px;font-weight:700;padding:0 12px;cursor:pointer}
  .iconbtn:active{background:rgba(255,255,255,.28)}

  .tabs{background:var(--deep-2)}
  .tabs-in{max-width:1200px;margin:0 auto;display:flex;width:100%}
  .tab{flex:1;border:0;background:transparent;color:rgba(255,255,255,.65);
    font-size:19px;font-weight:700;padding:16px 8px;cursor:pointer;border-bottom:5px solid transparent}
  .tab[aria-selected="true"]{color:#fff;border-bottom-color:#F0C24B;background:rgba(0,0,0,.12)}
  .tab .n{display:inline-block;min-width:30px;margin-left:6px;padding:1px 8px;border-radius:20px;
    background:rgba(255,255,255,.2);font-size:15px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:18px}
  .card{background:var(--card);border:1px solid var(--line);border-left:10px solid var(--wait);
    border-radius:var(--r);padding:16px 18px;text-align:left;width:100%;display:block;cursor:pointer}
  .card:active{background:#F6F5F1}
  .card.work{border-left-color:var(--work)}
  .card.urgent{border-left-color:var(--urg)}
  .menu{font-size:30px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{font-size:15px;font-weight:800;border-radius:7px;padding:4px 10px;flex:none;line-height:1.3}
  .tag.h{background:var(--hot);color:#fff}
  .tag.i{background:var(--ice);color:#fff}
  .tag.decaf{background:#5B3FA8;color:#fff}
  .tag.mycup{background:#2E7D4F;color:#fff}
  .tag.time{background:#E7E5DE;color:var(--ink)}
  .tag.time.urg{background:var(--urg);color:#fff}
  .who{margin-top:9px;font-size:19px;color:var(--muted);font-weight:600}
  .who b{color:var(--ink);font-weight:700}
  .note{margin-top:9px;font-size:16px;background:#FFF6DC;border-radius:8px;padding:7px 10px}
  .flag{margin-top:10px;font-size:16px;font-weight:700;color:var(--work)}
  .flag.ok{color:var(--done)}

  .make{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .make-top{background:#F7F6F2;padding:18px 20px;border-bottom:1px solid var(--line)}
  .make-top .menu{font-size:34px}
  .steps{list-style:none;margin:0;padding:8px 12px}
  .step{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px}
  .step.now{background:#FFF8E8;box-shadow:inset 0 0 0 2px #F0C24B}
  .step.past{opacity:.42}
  .num{flex:none;width:44px;height:44px;border-radius:50%;background:#E7E5DE;color:var(--muted);
    display:grid;place-items:center;font-size:20px;font-weight:800}
  .step.now .num{background:var(--work);color:#fff}
  .step.past .num{background:var(--done);color:#fff}
  .txt{font-size:23px;font-weight:600;letter-spacing:-.02em}

  .hint{margin:0 12px 10px;font-size:16px;color:var(--muted);padding:10px 14px;background:#F4F3EF;border-radius:10px}

  .actions{display:flex;gap:12px;padding:14px;border-top:1px solid var(--line);background:#FAF9F6}
  .btn{border:0;border-radius:12px;font-size:24px;font-weight:800;padding:22px 16px;cursor:pointer;letter-spacing:-.02em}
  .btn:active{transform:translateY(1px)}
  .btn.go{flex:1;background:var(--done);color:#fff}
  .btn.ship{flex:1;background:var(--ship);color:#fff}
  .btn.back{background:#E7E5DE;color:var(--ink);font-size:19px;padding:22px 20px}
  .btn.help{background:#F0C24B;color:#3A2C00;font-size:19px;padding:22px 20px}

  .place{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:14px}
  .place h3{margin:0;font-size:27px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .floor{font-size:15px;font-weight:800;background:var(--deep);color:#fff;border-radius:7px;padding:4px 10px}
  .cups{margin:12px 0 0;padding:0;list-style:none}
  .cups li{font-size:20px;padding:8px 0;border-top:1px solid #EFEDE6}
  .place .btn{width:100%;margin-top:14px}

  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty .big{font-size:26px;font-weight:700;color:var(--ink)}
  .empty p{font-size:18px}

  .pick{min-height:100vh;display:grid;place-items:center;padding:24px}
  .pick-in{width:100%;max-width:760px}
  .pick h1{font-size:38px;font-weight:800;letter-spacing:-.04em;margin:0 0 6px}
  .pick p{color:var(--muted);margin:0 0 28px;font-size:18px}

  .pickbtn:active{background:#F6F5F1}
  .pickbtn b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em}
  .pickbtn span{color:var(--muted);font-size:17px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:16px}
  .panel h3{margin:0 0 6px;font-size:21px;font-weight:800}
  .panel p{margin:0 0 14px;color:var(--muted);font-size:16px}
  .panel label{display:block;font-size:16px;font-weight:700;margin:14px 0 6px}
  input[type=text],textarea,select{width:100%;font-family:inherit;font-size:17px;padding:13px 14px;
    border:1px solid var(--line);border-radius:10px;background:#FCFBF8;color:var(--ink);
    -webkit-user-select:text;user-select:text}
  textarea{min-height:130px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .sbtn{border:0;background:var(--deep);color:#fff;border-radius:10px;font-size:17px;font-weight:700;
    padding:14px 20px;cursor:pointer}
  .sbtn.ghost{background:#E7E5DE;color:var(--ink)}
  .sbtn.warn{background:#B4462B;color:#fff}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
  th,td{border-bottom:1px solid #EFEDE6;padding:9px 6px;text-align:left}
  th{color:var(--muted);font-weight:700;font-size:14px}
  .msg{margin-top:12px;font-size:16px;padding:12px 14px;border-radius:10px;background:#EDF3EF;color:#1E5137}
  .msg.bad{background:#FBEDE9;color:#8C3520}

  .overlay{position:fixed;inset:0;background:rgba(31,58,52,.96);color:#fff;z-index:50;
    display:grid;place-items:center;text-align:center;padding:24px}
  .overlay .big{font-size:46px;font-weight:800;letter-spacing:-.04em;margin-bottom:10px}
  .overlay p{font-size:20px;opacity:.85;margin:0 0 30px}
  .banner{background:#FBEDE9;color:#8C3520;font-size:15px;padding:10px 16px;text-align:center}
</style>

<div id="root"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   [1] 레시피 — 실제 실습 절차에 맞게 이 부분만 고치시면 됩니다.
       cup    : 컵 준비 단계 (2번 태블릿)
       finish : 샷을 부어 완성하는 단계 (2번 태블릿)
   ══════════════════════════════════════════════════════════════════════ */
const MENUS = {
  "ame-h":{name:"아메리카노", temp:"HOT",
    hint:"물과 샷은 순서를 바꿔도 괜찮아요.",
    cup:["컵을 준비해요","뜨거운 물을 컵의 2/3만큼 부어요"],
    finish:["에스프레소 2샷을 부어요","뚜껑을 덮어요","트레이에 올려요"]},

  "ame-i":{name:"아메리카노", temp:"ICE",
    hint:"물과 샷은 순서를 바꿔도 괜찮아요.",
    cup:["컵을 준비해요","얼음을 컵에 가득 담아요","찬물을 얼음 위까지 부어요"],
    finish:["에스프레소 2샷을 부어요","빨대를 꽂아요","트레이에 올려요"]},

  "latte-h":{name:"카페라떼", temp:"HOT",
    cup:["컵을 준비해요","우유거품기에 우유를 MAX 선까지 부어요","거품기를 작동시켜요"],
    finish:["에스프레소 2샷을 컵에 부어요","데운 우유를 부어요","뚜껑을 덮어요","트레이에 올려요"]},

  "latte-i":{name:"카페라떼", temp:"ICE",
    cup:["컵을 준비해요","얼음을 컵에 가득 담아요","우유 130ml를 부어요"],
    finish:["에스프레소 2샷을 부어요","빨대를 꽂아요","트레이에 올려요"]},

  /* 바닐라라떼 — 파우더·시럽은 '에스프레소 자리'에서 샷잔에 먼저 넣습니다 (아래 VAN_PRE 참고) */
  "van-h":{name:"바닐라라떼", temp:"HOT",
    cup:["컵을 준비해요","우유거품기에 우유를 MAX 선까지 부어요","거품기를 작동시켜요"],
    finish:["바닐라 샷을 컵에 부어요","데운 우유를 부어요","뚜껑을 덮어요","트레이에 올려요"]},

  "van-i":{name:"바닐라라떼", temp:"ICE",
    cup:["컵을 준비해요","얼음을 컵에 가득 담아요","우유 130ml를 부어요"],
    finish:["바닐라 샷을 부어요","빨대를 꽂아요","트레이에 올려요"]}
};

/* ── 에스프레소 자리 (1번 태블릿) ─────────────────────────────────────
   모든 메뉴 1컵 = 2샷 분량 / 원두는 디카페인이 기본값이라 별도 안내 없음
   바닐라라떼는 샷잔에 파우더 15g + 시럽 1펌프를 먼저 넣고 그 위에 추출합니다. */
const SHOT_FULL = ["포터필터를 빼요","가루를 털고 마른 행주로 닦아요","원두를 담아요 (2샷 분량)",
                   "고르게 펴고 탬핑해요","머신에 끼워요","샷잔을 놓고 추출 버튼을 눌러요"];
const SHOT_SHORT= ["원두를 담아요 (2샷 분량)","탬핑해요","샷잔을 놓고 추출해요"];
const DELIVER   = "샷잔을 옆 자리에 전달해요";
const VAN_PRE   = ["샷잔에 바닐라 파우더 15g을 넣어요","바닐라 시럽을 1번 눌러 넣어요"];
const VAN_POST  = ["잘 저어서 파우더를 녹여요"];
const SHOT_ONE      = "에스프레소 2샷을 내려서 전달해요";
const SHOT_ONE_VAN  = "샷잔에 파우더·시럽을 넣고 2샷을 내려 녹인 뒤 전달해요";
const MYCUP_STEP = "개인컵을 가져와 이름을 확인해요";

const PLACES = {
  "보건실":1,"상담실":1,"개별학습반1":1,"진로실":1,"교장실":1,"행정실":1,
  "본교무실":2,"교육복지실":2,"2학년 교무실":2,
  "1학년 교무실":3,
  "3학년 교무실":4
};

const KEY = "barista:day";
const COLS = "이름 / 메뉴 / HOT·ICE / 개인컵·일회용컵 / 카페인 유·무 / 배달장소 / 배달 희망 시간 / 메모";

/* ══════════════════════════════════════════════════════════════════════
   [2] 상태
   ══════════════════════════════════════════════════════════════════════ */
let station=null, tab="cup", making=null, overlay=false, sound=true, storageOK=true, msg=null;
let S = { rev:0, date:today(), level:1, sheetUrl:"", cups:[], help:0 };

function today(){const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function now(){ return new Date().toISOString(); }
function hhmm(iso){ if(!iso) return "-"; const d=new Date(iso);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }

/* ══════════════════════════════════════════════════════════════════════
   [3] 저장소 — 두 태블릿 동기화
   ══════════════════════════════════════════════════════════════════════ */
async function pull(){
  try{ const r = await window.storage.get(KEY, true);
    if(r && r.value){ const rm = JSON.parse(r.value); if(rm.rev > S.rev){ S = rm; return true; } }
  }catch(e){}
  return false;
}
async function push(){
  try{ S.rev++; await window.storage.set(KEY, JSON.stringify(S), true); storageOK=true; }
  catch(e){ storageOK=false; }
}
async function mutate(fn){
  try{ const r = await window.storage.get(KEY, true);
    if(r && r.value){ const rm = JSON.parse(r.value); if(rm.rev >= S.rev) S = rm; }
  }catch(e){}
  fn(); await push(); render();
}

/* ══════════════════════════════════════════════════════════════════════
   [4] 시트 읽기
   ══════════════════════════════════════════════════════════════════════ */
function splitRows(text){
  const rows=[]; let row=[], cell="", q=false;
  const sep = (text.includes("\t") && !text.includes(",\"")) ? "\t" : ",";
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(c!=="\r") cell+=c;
  }
  row.push(cell); rows.push(row);
  return rows.filter(r=>r.some(v=>v.trim()!==""));
}
function menuKey(menuRaw, tempRaw){
  const m=(menuRaw||"").replace(/\s/g,"");
  const t=((tempRaw||"")+m).replace(/\s/g,"");
  const ice=/아이스|ICE|ice|Ice|차가|콜드|cold/.test(t);
  const base = /바닐라/.test(m) ? "van" : /라떼|라테|latte/i.test(m) ? "latte"
             : /아메|americano/i.test(m) ? "ame" : null;
  return base ? base+(ice?"-i":"-h") : null;
}
function placeName(raw){
  const v=(raw||"").replace(/\s/g,"");
  for(const p in PLACES) if(p.replace(/\s/g,"")===v) return p;
  for(const p in PLACES) if(v && (v.includes(p.replace(/\s/g,""))||p.replace(/\s/g,"").includes(v))) return p;
  return raw ? raw.trim() : "장소 미기재";
}
function parseTime(raw){
  const v=(raw||"").trim(); if(!v) return null;
  const m = v.match(/(\d{1,2})\s*[:시]\s*(\d{1,2})?/);
  if(m){ let h=+m[1], mi=m[2]?+m[2]:0;
    if(/오후|pm|PM/.test(v) && h<12) h+=12;
    if(h>=0&&h<24&&mi>=0&&mi<60) return h*60+mi; }
  return null;
}

function parseOrders(text){
  const rows = splitRows(text);
  if(!rows.length) return {cups:[], skipped:0};
  let ix={name:0,menu:1,temp:2,cup:3,caf:4,place:5,time:6,note:7,qty:-1};
  let start=0;
  const head = rows[0].map(h=>h.replace(/\s/g,""));
  if(head.some(h=>/메뉴|음료/.test(h))){
    start=1;
    head.forEach((h,i)=>{
      if(/이름|주문자|성함|선생님/.test(h)) ix.name=i;
      else if(/메뉴|음료/.test(h)) ix.menu=i;
      else if(/HOT|ICE|hot|ice|온도|따뜻|아이스/.test(h)) ix.temp=i;
      else if(/개인컵|일회용|텀블러|컵종류|컵$/.test(h)) ix.cup=i;
      else if(/카페인|디카/.test(h)) ix.caf=i;
      else if(/장소|교실|배달장소|부서|위치/.test(h)) ix.place=i;
      else if(/시간|희망/.test(h)) ix.time=i;
      else if(/메모|요청|비고/.test(h)) ix.note=i;
      else if(/잔|수량|개수/.test(h)) ix.qty=i;
    });
  }
  const cups=[]; let skipped=0; const seen={};
  rows.slice(start).forEach(r=>{
    const g = i => (i>=0 && r[i]!=null) ? String(r[i]) : "";
    const key = menuKey(g(ix.menu), g(ix.temp));
    if(!key){ skipped++; return; }
    const name  = g(ix.name).trim() || "이름 미기재";
    const place = placeName(g(ix.place));
    const note  = g(ix.note).trim();
    const timeRaw = g(ix.time).trim();
    const cupRaw  = g(ix.cup).replace(/\s/g,"");
    const cafRaw  = g(ix.caf).replace(/\s/g,"");
    const mycup = /개인|텀블러|머그|내컵/.test(cupRaw);
    const decaf = /무|없|디카|X|x|논|non/.test(cafRaw);
    let qty = ix.qty>=0 ? parseInt(g(ix.qty).replace(/[^0-9]/g,""),10) : 1;
    if(!qty||qty<1) qty=1; if(qty>20) qty=20;
    for(let i=0;i<qty;i++){
      const sig=[name,place,key,mycup?"M":"D",decaf?"N":"C",timeRaw].join("|");
      seen[sig]=(seen[sig]||0)+1;
      cups.push({ id:sig+"|"+seen[sig], name, place, menuKey:key, note, mycup, decaf,
                  timeRaw, timeMin:parseTime(timeRaw),
                  shot:false, cupPrep:false, finish:false, ship:false, t:{} });
    }
  });
  return {cups, skipped};
}

async function importText(text){
  const {cups, skipped} = parseOrders(text);
  if(!cups.length){ msg={bad:true,s:"읽을 수 있는 주문이 없습니다. 메뉴 칸에 아메리카노·카페라떼·바닐라라떼가 들어가 있는지 확인해 주세요."}; render(); return; }
  await mutate(()=>{
    const keep = new Map(S.cups.filter(c=>c.shot||c.cupPrep||c.finish||c.ship).map(c=>[c.id,c]));
    S.cups = cups.map(c => keep.get(c.id) ? Object.assign(keep.get(c.id),{note:c.note}) : c);
    keep.forEach((c,id)=>{ if(!S.cups.some(x=>x.id===id)) S.cups.push(Object.assign(c,{removed:true})); });
    S.date = today();
  });
  msg={s:`주문 ${cups.length}잔을 불러왔습니다.`+(skipped?` (읽지 못한 줄 ${skipped}개는 건너뛰었습니다.)`:"")};
  render();
}
async function fetchSheet(url){
  msg={s:"시트를 불러오는 중입니다…"}; render();
  try{
    const res = await fetch(url,{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    await importText(await res.text());
    await mutate(()=>{ S.sheetUrl=url; });
  }catch(e){
    msg={bad:true,s:"시트를 불러오지 못했습니다. '웹에 게시 → CSV'로 만든 주소인지 확인해 주세요. 계속 안 되면 아래 '주문 붙여넣기'를 사용하시면 됩니다."};
    render();
  }
}

let actx=null;
function beep(f=660,ms=140){
  if(!sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=f; o.type="sine"; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.18,actx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+ms/1000);
    o.start(); o.stop(actx.currentTime+ms/1000+.02);
  }catch(e){}
}

const root=document.getElementById("root");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function alive(){ return S.cups.filter(c=>!c.removed||c.shot||c.cupPrep||c.finish||c.ship); }
function byTime(a,b){ return (a.timeMin==null?9999:a.timeMin)-(b.timeMin==null?9999:b.timeMin); }
function waitShot(){ return alive().filter(c=>!c.shot).sort(byTime); }
function waitCup(){ return alive().filter(c=>!c.cupPrep).sort(byTime); }
function waitFinish(){ return alive().filter(c=>c.cupPrep&&c.shot&&!c.finish).sort(byTime); }
function waitShip(){ return alive().filter(c=>c.finish&&!c.ship); }
function left(){ return alive().filter(c=>!c.ship).length; }
function urgent(c){ return c.timeMin!=null && c.timeMin-nowMin() <= 10; }

function tags(c){
  const m=MENUS[c.menuKey];
  let h=`<span class="tag ${m.temp==="HOT"?"h":"i"}">${m.temp}</span>`;
  /* 카페인 열은 시트에서 숨겨 두신 열이라 화면에 표시하지 않습니다.
     다시 사용하시게 되면 아래 한 줄의 주석을 풀면 배지가 나옵니다. */
  // if(c.decaf) h+=`<span class="tag decaf">카페인 무</span>`;
  if(c.mycup) h+=`<span class="tag mycup">개인컵</span>`;
  if(c.timeRaw) h+=`<span class="tag time ${urgent(c)?"urg":""}">${esc(c.timeRaw)}</span>`;
  return h;
}
function card(c,cls,flag){

function stepsFor(c){
  const m=MENUS[c.menuKey];
  if(station==="A"){
    const van = c.menuKey.indexOf("van")===0;
    if(S.level==3) return [ van ? SHOT_ONE_VAN : SHOT_ONE ];
    const mid = (S.level==1) ? SHOT_FULL : SHOT_SHORT;
    return [ ...(van?VAN_PRE:[]), ...mid, ...(van?VAN_POST:[]), DELIVER ];
  }
  if(tab==="cup"){
    const s=[...m.cup];
    if(c.mycup) s.unshift(MYCUP_STEP);
    return s;
  }
  return m.finish;
}
function makeView(c){

function shipView(){
  const cups=waitShip();

  const by={}; cups.forEach(c=>{ (by[c.place]=by[c.place]||[]).push(c); });
  const order=Object.keys(by).sort((a,b)=>{
    const ta=Math.min(...by[a].map(c=>c.timeMin==null?9999:c.timeMin));
    const tb=Math.min(...by[b].map(c=>c.timeMin==null?9999:c.timeMin));
    return ta-tb || (PLACES[a]||9)-(PLACES[b]||9) || a.localeCompare(b,"ko");
  });
  return order.map(p=>{
    const f=PLACES[p];
    const t=by[p].map(c=>c.timeRaw).filter(Boolean)[0];
    return `<div class="place">
      <h3><span class="floor">${f?f+"층":"층 확인"}</span>${esc(p)}${t?`<span class="tag time">${esc(t)}</span>`:""}</h3>
      <ul class="cups">${by[p].map(c=>{const m=MENUS[c.menuKey];

      <button class="btn ship" data-ship="${esc(p)}">${esc(p)} 배달 완료 (${by[p].length}잔)</button>
    </div>`;
  }).join("");
}

function render(){
  if(!station){
    root.innerHTML=`<div class="pick"><div class="pick-in">

      <button class="pickbtn" data-pick="T"><b>선생님 화면</b><span>주문 불러오기, 단계 조절, 기록 보기</span></button>

  if(station==="T"){ root.innerHTML=header()+teacherView(); return; }

  let body;

  else if(station==="A"){

  }

  else if(tab==="fin"){

      ? `<div class="grid">${list.map(c=>card(c,"work",{s:"샷과 컵이 모두 준비됐어요",ok:true})).join("")}</div>`

root.addEventListener("click", async (e)=>{
  const t=e.target.closest("[data-pick],[data-open],[data-act],[data-tab],[data-ship],[data-step]");
  if(!t) return;

  if(t.dataset.pick){ station=t.dataset.pick; msg=null; await pull(); render(); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; making=null; render(); return; }
  if(t.dataset.open){ making=t.dataset.open; const c=S.cups.find(x=>x.id===making); if(c) c.stepAt=0; render(); return; }

  if(t.dataset.step!==undefined && making){
    const c=S.cups.find(x=>x.id===making); if(!c) return;
    const i=+t.dataset.step;
    c.stepAt = (i===c.stepAt) ? i+1 : i;
    beep(560,90); render(); return;
  }
  if(t.dataset.ship){
    const p=t.dataset.ship;
    await mutate(()=>{ S.cups.forEach(c=>{ if(c.place===p&&c.finish&&!c.ship){ c.ship=true; c.t.ship=now(); } }); });
    beep(880,220); return;
  }

  const act=t.dataset.act;
  if(act==="sound"){ sound=!sound; if(sound) beep(700,120); render(); return; }
  if(act==="switch"){ station=null; making=null; render(); return; }
  if(act==="close"){ making=null; render(); return; }
  if(act==="closehelp"){ overlay=false; render(); return; }
  if(act==="help"){ overlay=true; beep(440,300); await mutate(()=>{ S.help++; }); return; }

  if(act==="done" && making){
    const id=making;
    await mutate(()=>{
      const c=S.cups.find(x=>x.id===id); if(!c) return;
      if(station==="A"){ c.shot=true; c.t.shot=now(); }
      else if(tab==="cup"){ c.cupPrep=true; c.t.cupPrep=now(); }
      else { c.finish=true; c.t.finish=now(); }
    });
    making=null; beep(784,200); render(); return;
  }

  if(act==="fetch"||act==="refetch"){
    const u = act==="fetch" ? document.getElementById("url").value.trim() : S.sheetUrl;
    if(!u){ msg={bad:true,s:"먼저 게시된 시트 주소를 입력해 주세요."}; render(); return; }
    await fetchSheet(u); return;
  }
  if(act==="paste"){
    const v=document.getElementById("paste").value.trim();
    if(!v){ msg={bad:true,s:"붙여넣은 내용이 없습니다."}; render(); return; }
    await importText(v); return;
  }
  if(act==="level"){
    const lv=+document.getElementById("lv").value;
    await mutate(()=>{ S.level=lv; }); msg={s:"단계 수준을 저장했습니다."}; render(); return;
  }
  if(act==="copy"){
    const rows=[["메뉴","온도","컵","받는 분","장소","희망시간","샷","컵준비","완성","배달"].join("\t")];
    alive().sort(byTime).forEach(c=>{const m=MENUS[c.menuKey];
      rows.push([m.name,m.temp,c.mycup?"개인컵":"일회용",c.name,c.place,c.timeRaw||"",
                 hhmm(c.t.shot),hhmm(c.t.cupPrep),hhmm(c.t.finish),hhmm(c.t.ship)].join("\t"));});
    const ta=document.createElement("textarea"); ta.value=rows.join("\n");
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); msg={s:"기록을 복사했습니다. 스프레드시트에 붙여넣으시면 됩니다."}; }
    catch(err){ msg={bad:true,s:"복사하지 못했습니다."}; }
    ta.remove(); render(); return;
  }
  if(act==="reset"){
    if(!confirm("오늘 진행 기록을 모두 지우고 새로 시작할까요?")) return;
    await mutate(()=>{ S.cups=[]; S.help=0; S.date=today(); });
    msg={s:"새로 시작했습니다. 주문을 다시 불러와 주세요."}; render(); return;
  }
});
